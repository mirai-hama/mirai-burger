<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>未来バーガー｜仕事体験 v7</title>
<style>
:root{--orange:#f97316;--red:#e1261c;--yellow:#f5b900;--green:#42a62a;--blue:#2468c7;--line:#e5e7eb;--ink:#111827}
*{box-sizing:border-box} body{margin:0;background:#f7f7f7;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
button,input,select{font:inherit} button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#fff7ed,#fff)}
.loginbox{width:min(420px,100%);background:#fff;border:1px solid #eee;border-radius:24px;padding:28px;box-shadow:0 15px 45px #0001;text-align:center}
.loginbox .big{font-size:64px} .loginbox input{width:100%;padding:14px;border:2px solid #ddd;border-radius:12px;margin:12px 0}
.err{height:24px;color:#d11;font-weight:800}
.app{max-width:1200px;margin:auto;background:#fff;min-height:100vh}
header{height:78px;display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:4}
.logo{font-size:26px;font-weight:1000;color:#df241b;white-space:nowrap} .logo small{display:block;font-size:10px;color:#e55;text-align:center}
.instruction{flex:1;text-align:center;font-size:19px;font-weight:900;white-space:nowrap;letter-spacing:-0.4px} .instruction span{color:#f59e0b}
.instruction{white-space:nowrap} .smallnote{padding:10px;background:#fff8e8;border:1px solid #f1d48a;border-radius:10px;margin-top:8px;font-size:13px}
.orderBtn{background:#f06d00;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:900}
.layout{display:grid;grid-template-columns:135px 1fr;gap:12px;padding:12px}
.sideNav{display:flex;flex-direction:column;gap:8px}
.nav{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px 8px;text-align:center;font-weight:900;min-height:105px}
.nav.active{border:3px solid #f27b1a;color:#ed6500}
.nav .ico{font-size:38px;display:block;margin-bottom:5px}
.content{min-width:0}
.section{margin-bottom:10px;border:1px solid #ddd;border-radius:10px;overflow:hidden}
.section h2{margin:0;color:#fff;font-size:18px;padding:7px 12px}
.red h2{background:linear-gradient(90deg,#e63b21,#d92316)} .yellow h2{background:#f0b500} .green h2{background:#46a92d} .blue h2{background:#2468c7}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:#eee}
.card{background:#fff;border:0;min-height:160px;padding:8px;text-align:center;transition:.12s;position:relative}
.card:hover{background:#fffaf5} .card:active{transform:scale(.98)}
.card img{width:100%;height:105px;object-fit:contain;object-position:center center;display:block}.drink-card img{object-position:center center;height:105px;transform:translateX(14px)}.drink-card{overflow:hidden} .card .name{font-weight:900;font-size:15px;line-height:1.2} .price{font-weight:1000;color:#d71920;font-size:20px}
.setgrid{grid-template-columns:repeat(7,minmax(0,1fr))}
.setgrid .card{min-height:145px} .setgrid .card img{height:90px}.drink-sizes{display:flex;gap:5px;justify-content:center;margin-top:5px}.sizeBtn{border:1px solid #ccc;background:#fff;border-radius:7px;padding:5px 8px;font-weight:900;font-size:13px}.sizeBtn.selected{border:3px solid #f97316;background:#fff1d6;box-shadow:0 0 0 3px rgba(249,115,22,.22),0 0 14px rgba(249,115,22,.35);transform:translateY(-1px)}.sizePrice{display:block;font-size:11px;color:#d71920;margin-top:1px}
.bottom{display:grid;grid-template-columns:1fr 1.45fr;gap:12px;margin-top:12px}
{border:2px solid #e33;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between}
.cartbox b{font-size:24px} .cartnum{color:#d71920;font-size:34px;font-weight:1000}
.next{border:0;border-radius:14px;background:#eee;color:#999;font-weight:1000;font-size:20px;padding:20px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:10}
.modalbox{width:min(540px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0005}
.modalbox h3{margin-top:0}
.modalbox p:not([style*="text-align:center"]){text-align:left} .modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modalBtn{padding:14px;border:2px solid #ddd;border-radius:12px;background:#fff;font-weight:900;transition:.12s}.modalBtn.selected{border:3px solid #f97316;background:#fff1d6;box-shadow:0 0 0 3px rgba(249,115,22,.22),0 0 14px rgba(249,115,22,.35);transform:translateY(-1px)}
.primary{background:#16a34a;color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:900}
.secondary{background:#fff;border:2px solid #ddd;border-radius:12px;padding:12px 18px;font-weight:900}
.cartList{max-height:55vh;overflow:auto} .cartrow{display:flex;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #eee}
.total{font-size:28px;font-weight:1000;text-align:right;margin:12px 0}
.payinput{width:100%;padding:15px;border:2px solid #ddd;border-radius:12px}
.change{font-size:44px;color:#16a34a;font-weight:1000;text-align:center;margin:18px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.hidden{display:none!important}
@media(max-width:800px){
header{height:auto;flex-wrap:wrap} .instruction{order:3;flex-basis:100%;font-size:13px;padding-bottom:5px;white-space:nowrap;letter-spacing:-0.7px}
.layout{grid-template-columns:80px 1fr;padding:6px} .nav{min-height:80px;padding:8px 3px;font-size:11px} .nav .ico{font-size:28px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))} .setgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.bottom{grid-template-columns:1fr} .logo{font-size:20px} .orderBtn{padding:10px}
}

html,body{min-height:100%;} body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);} @media (display-mode:standalone){header{padding-top:max(10px,env(safe-area-inset-top));}}

  "爽健美茶": {default:"M", prices:{S:150,M:150,L:230}},
  "コーヒー": {default:"S", prices:{S:140,M:180}},
  "カフェラテ": {default:"S", prices:{S:220,M:280}}
};
let cart=[];

function login(){
  if(document.getElementById('pw').value===PASS){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    showCat('burger');
  }else document.getElementById('err').textContent='パスワードが違います。';
}
function total(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}
function update(){
  const n=cart.reduce((s,x)=>s+x.qty,0), t=total();
  document.getElementById('count').textContent=n; document.getElementById('count2').textContent=n; document.getElementById('miniTotal').textContent=t;
  document.getElementById('confirmBtn').style.background=n?'#fff3e8':'#eee';
  document.getElementById('confirmBtn').style.color=n?'#111':'#999';
}
function showCat(cat){
  const titles={burger:'1. バーガーメニュー',side:'2. サイドメニュー',drink:'3. ドリンクメニュー',set:'4. セットメニュー'};
  const colors={burger:'red',side:'yellow',drink:'green',set:'blue'};
  let html=`<section class="section ${colors[cat]}"><h2>${titles[cat]}</h2><div class="grid ${cat==='set'?'setgrid':''}">`;
  products[cat].forEach((p,i)=>{
    html+=`<button class="card ${cat==='drink'?'drink-card':''}" onclick="choose('${cat}',${i})"><img src="${assets[p[2]]}" alt=""><div class="name">${p[0]}</div><div class="price">${p[1]}円</div></button>`;
  });
  html+='</div></section>';
  if(cat==='side') html+=`<div class="smallnote">ナゲットを選ぶと、バーベキューソース／マスタードソースを選択できます。</div>`;
  if(cat==='set') html+=`<div style="padding:10px;background:#fff;border:1px solid #ddd;border-radius:10px">セットを選ぶと、ポテトS/M/Lとドリンクを変更できます。</div>`;
  document.getElementById('sections').innerHTML=html;
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  const idx={burger:0,side:1,drink:2,set:3}[cat]; document.querySelectorAll('.nav')[idx].classList.add('active');
}
function addToCart(name,price,detail=''){
  const key = name+'|'+price+'|'+detail;
  const found = cart.find(x=>x.key===key);
  if(found) found.qty += 1;
  else cart.push({key,name,price,qty:1,detail});
  update();
}
function choose(cat,i){
  const p=products[cat][i];
  if(cat==='side' && p[0].includes('ナゲット')){ nugget(p); return; }
  if(cat==='set'){ setModal(p); return; }
  if(cat==='drink'){ drinkModal(p); return; }
  addToCart(p[0],p[1]);
}
function drinkModal(p){
  const d=drinkSizes[p[0]], sizes=Object.keys(d.prices);
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalBox').innerHTML=`<h3>🥤 ${p[0]}｜サイズを選択</h3>
    <div class="modalgrid">${sizes.map(sz=>`<button class="modalBtn" onclick="addDrink('${p[0]}','${sz}')">${sz}サイズ<br><b>${d.prices[sz]}円</b></button>`).join('')}</div>
    <div class="actions" style="margin-top:15px"><button class="secondary" onclick="closeModal()">キャンセル</button></div>`;
}
function addDrink(name,size){ const d=drinkSizes[name]; addToCart(name+' '+size,d.prices[size]); closeModal(); }
function nugget(p){
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalBox').innerHTML=`<h3>🍗 ${p[0]}｜ソースを選択</h3>
  <div class="modalgrid"><button class="modalBtn" onclick="addNugget('${p[0]}',${p[1]},'バーベキューソース')">バーベキューソース</button>
  <button class="modalBtn" onclick="addNugget('${p[0]}',${p[1]},'マスタードソース')">マスタードソース</button></div>
  <div class="actions" style="margin-top:15px"><button class="secondary" onclick="closeModal()">キャンセル</button></div>`;
}
function addNugget(n,p,s){addToCart(n,p,s);closeModal()}
function setModal(p){
  document.getElementById('modal').classList.remove('hidden');
  const drinkNames=Object.keys(drinkSizes);
  document.getElementById('modalBox').innerHTML=`<h3>🍔 ${p[0]}</h3>
  <p>サイドメニューとドリンクを選んでください。</p>
  <label>サイドメニュー　<select id="setSide" onchange="renderSetSideOptions()">
    <option value="potato">ポテト</option>
    <option value="nugget5">チキンナゲット 5ピース</option>
    <option value="salad">サラダ</option>
  </select></label>
  <div id="setSideOptions" style="margin-top:12px"></div>
  <br>
  <label>ドリンク　<select id="drink" onchange="renderSetDrinkSizes()">${drinkNames.map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label>
  <div id="setDrinkSizes" style="margin-top:12px"></div>
  <p style="font-size:12px;color:#666">セットはポテトM＋ドリンクM（コーヒー・カフェラテはS）が基本です。ポテトSは−50円、Lは＋50円。ナゲット5ピース・サラダへの変更は追加料金なしです。ドリンクは種類とサイズに応じて差額が加算されます。</p>
  <div class="actions" style="margin-top:15px"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="addSet('${p[0]}',${p[1]})">セットを追加</button></div>`;
  renderSetSideOptions();
  renderSetDrinkSizes();
}
function renderSetSideOptions(){
  const side=document.getElementById('setSide').value;
  const el=document.getElementById('setSideOptions');
  if(side==='potato'){
    el.innerHTML='<b>ポテトサイズ</b><div class="modalgrid" style="margin-top:7px">'+
      [['S',-50],['M',0],['L',50]].map(x=>`<button class="modalBtn ${x[0]==='M'?'selected':''}" data-size="${x[0]}" onclick="selectSetSideOption('${x[0]}')">${x[0]}サイズ<br><small>${x[1]===0?'基本':(x[1]>0?'＋'+x[1]+'円':'−'+Math.abs(x[1])+'円')}</small></button>`).join('')+
      '</div>';
    window.selectedSetSide='potato'; window.selectedSetSideSize='M';
  }else if(side==='nugget5'){
    el.innerHTML='<b>ソース</b><div class="modalgrid" style="margin-top:7px"><button class="modalBtn selected" data-sauce="バーベキューソース" onclick="selectSetNuggetSauce(\'バーベキューソース\')">バーベキューソース</button><button class="modalBtn" data-sauce="マスタードソース" onclick="selectSetNuggetSauce(\'マスタードソース\')">マスタードソース</button></div>';
    window.selectedSetSide='nugget5'; window.selectedSetNuggetSauce='バーベキューソース';
  }else{
    el.innerHTML='<p style="margin:8px 0"><b>サラダ</b></p>';
    window.selectedSetSide='salad';
  }
}
function selectSetSideOption(size){
  window.selectedSetSide='potato'; window.selectedSetSideSize=size;
  document.querySelectorAll('#setSideOptions .modalBtn').forEach(b=>b.classList.toggle('selected',b.dataset.size===size));
}
function selectSetNuggetSauce(sauce){
  window.selectedSetNuggetSauce=sauce;
  document.querySelectorAll('#setSideOptions .modalBtn').forEach(b=>b.classList.toggle('selected',b.dataset.sauce===sauce));
}
function renderSetDrinkSizes(){
  const name=document.getElementById('drink').value, d=drinkSizes[name];
  const sizes=Object.keys(d.prices);
  const allowed = (d.default==='M') ? ['M','L'] : ['S','M'];
  document.getElementById('setDrinkSizes').innerHTML='<b>ドリンクサイズ</b><div class="modalgrid" style="margin-top:7px">'+allowed.map(sz=>{
    const diff=(sz===d.default)?0:50;
    return `<button class="modalBtn ${sz===d.default?'selected':''}" data-size="${sz}" onclick="selectSetDrinkSize('${sz}')">${sz}サイズ<br>${diff===0?'基本':'＋'+diff+'円'}</button>`;
  }).join('')+'</div>';
  window.selectedSetDrinkSize=d.default;
}
function selectSetDrinkSize(size){
  window.selectedSetDrinkSize=size;
  document.querySelectorAll('#setDrinkSizes .modalBtn').forEach(b=>b.classList.toggle('selected',b.dataset.size===size));
}
function addSet(n,base){
  const side=document.getElementById('setSide').value;
  let sideSurcharge=0, sideDetail='';
  if(side==='potato'){
    const size=window.selectedSetSideSize || 'M';
    sideSurcharge={S:-50,M:0,L:50}[size];
    sideDetail=`ポテト${size}`;
  }else if(side==='nugget5'){
    sideSurcharge=0;
    sideDetail=`チキンナゲット5ピース・${window.selectedSetNuggetSauce||'バーベキューソース'}`;
  }else{
    sideSurcharge=0;
    sideDetail='サラダ';
  }
  const drinkName=document.getElementById('drink').value, d=drinkSizes[drinkName], size=window.selectedSetDrinkSize || d.default;
  const drinkTypeSurcharge=d.prices[d.default]-150;
  const drinkSurcharge=(size===d.default)?0:50;
  const price=base+sideSurcharge+drinkTypeSurcharge+drinkSurcharge;
  addToCart(n,price,`${sideDetail}・${drinkName}${size}`);
  closeModal();
}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function showCart(){
  document.getElementById('modal').classList.remove('hidden');
  const t=total();
  document.getElementById('modalBox').innerHTML=`<h3>🧾 注文リスト</h3>
  <div class="cartList">${cart.length?cart.map((x,i)=>`<div class="cartrow"><div style="flex:1;min-width:0"><b>${x.name}</b>${x.detail?`<br><small>${x.detail}</small>`:''}<br><small>× ${x.qty}</small></div><div style="text-align:right;white-space:nowrap">${x.price*x.qty}円<br><button class="secondary" onclick="removeItem(${i})">削除</button></div></div>`).join(''):'<p>まだ注文がありません。</p>'}</div>
  <div class="total">合計 ${t}円</div><div class="actions"><button class="secondary" onclick="closeModal()">メニューに戻る</button>${cart.length?'<button class="primary" onclick="closeModal();confirmOrder()">注文内容を確認</button>':''}</div>`;
}
function removeItem(i){cart.splice(i,1);update();showCart()}
function confirmOrder(){
  if(!cart.length){alert('注文リストに商品を追加してください。');return}
  const t=total();
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modalBox').innerHTML=`<h3>注文内容の確認</h3>
  <div class="cartList">${cart.map(x=>`<div class="cartrow"><div><b>${x.name}</b>${x.detail?`<br><small>${x.detail}</small>`:''}<br><small>× ${x.qty}</small></div><div>${x.price*x.qty}円</div></div>`).join('')}</div>
  <div class="total">お会計 ${t}円</div>
  <p style="text-align:center;font-weight:900">注文を繰り返して、内容に間違いがなければ「注文を確定する」を押してください。</p>
  <div class="actions"><button class="secondary" onclick="closeModal()">戻る</button><button class="primary" onclick="payment()">注文を確定する</button></div>`;
}
function payment(){
  const t=total();
  document.getElementById('modalBox').innerHTML=`<h3>💴 お会計</h3><div class="total">お会計は ${t}円です</div>
  <p>「お会計は○○円です」とお客様に伝え、お金を受け取ります。受け取った金額を入力する前に、「○○円お預かりします」とお客様に伝えます。</p>
  <input id="received" class="payinput" type="number" inputmode="numeric" placeholder="お預かりした金額">
  <div id="changeArea"></div>
  <div class="actions" style="margin-top:15px"><button class="secondary" onclick="confirmOrder()">戻る</button><button class="primary" onclick="calcChange()">お釣りを計算</button></div>`;
}
function calcChange(){
  const t=total(),r=Number(document.getElementById('received').value),a=document.getElementById('changeArea');
  if(r<t){a.innerHTML='<p style="color:#d11;font-weight:900">お預かり金額が不足しています。</p>';return}
  a.innerHTML=`<div class="change">${r-t}円</div><p style="text-align:center">お客様にお釣りを渡すときは、「○○円のお返しになります」と伝え、会計を完了するボタンを押します。</p><div class="actions"><button class="primary" style="width:100%" onclick="finish()">会計を完了する</button></div>`;
}
function finish(){
  document.getElementById('modalBox').innerHTML=`<div style="text-align:center"><div style="font-size:70px">🎉</div><h2>お仕事完了！</h2><p>「ありがとうございました」とお客様に伝えましょう。</p><button class="primary" onclick="resetGame()">最初からやり直す</button></div>`;
}
function resetGame(){cart=[];update();closeModal();showCat('burger')}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body></html>
